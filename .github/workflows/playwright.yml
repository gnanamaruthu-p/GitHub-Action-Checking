name: Playwright Tests   # workflow name 

env:
  DB_HOST: ${{ secrets.DB_HOST }}
  API_URL: ${{ secrets.API_URL_STAGING }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api_changed: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect API Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'

  test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        environment: [staging, production]

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # Install Playwright Browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Run Playwright Tests
      - name: Run Playwright Tests
        run: npx playwright test

      # Debug Environment
      - name: Check Environment
        if: always()
        run: |
          echo "========== NODE =========="
          node -v

          echo "========== NPM =========="
          npm -v

          echo "========== ALLURE VERSION =========="
          npx allure --version || echo "Allure not found"

          echo "========== INSTALLED PACKAGES =========="
          npm list --depth=0

      # Check Allure Results
      - name: Check Allure Results Folder
        if: always()
        run: |
          echo "========== CURRENT DIRECTORY =========="
          pwd

          echo "========== PROJECT FILES =========="
          ls -la

          echo "========== ALLURE RESULTS =========="
          ls -R allure-results || echo "allure-results folder not found"

      # Generate Allure Report
      - name: Generate Allure Report
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report

      # List Allure Report Files
      - name: List Allure Report Files
        if: always()
        run: |
          ls -R allure-report

      # Check Generated Report
      - name: Check Generated Allure Report
        if: always()
        run: |
          echo "========== ALLURE REPORT =========="
          ls -R allure-report || echo "allure-report folder not found"

      # Upload Playwright HTML Report
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      # Upload Allure Report
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      # Upload Allure Results
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

  smoke-tests:
    needs: [changes, test]
    if: ${{ needs.changes.result == 'success' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Smoke Tests
        run: echo "Running smoke tests after UI tests passed"

  integration-tests:
    needs: changes
    if: needs.changes.outputs.api_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Integration Tests
        run: echo "Running integration tests because API files changed"

  deploy:
    needs: [test, smoke-tests, integration-tests]
    if: ${{ always() && needs.test.result == 'success' && needs.smoke-tests.result == 'success' && (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Application
        run: echo "Deploying application"